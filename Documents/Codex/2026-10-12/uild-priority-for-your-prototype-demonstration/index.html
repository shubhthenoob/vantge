          state.view === "profile"
            ? profilePage
            : {

                monitor: monitoringPage,
                overview: overviewPage,
                due: duePage,
                queue: queuePage,
                settings: settingsPage,
              }[state.page] || discoveryPage;
        c.innerHTML = pg();
        $$(".nav button").forEach((b) => {
          const on = b.dataset.arg === (state.view === "profile" ? "discovery" : state.page);
          b.classList.toggle("active", on);
          on ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current");
        });
        $("#navAlert").classList.toggle("hidden", !openAlert());
        $("#bell").classList.toggle("unread", !state.notifRead && notifs().length > 0);
        const dz = $("#dropzone");
        if (dz) {
          ["dragover", "drop"].forEach((ev) =>
            dz.addEventListener(ev, (e) => {
              e.preventDefault();
              if (ev === "drop") addFiles(e.dataTransfer.files);
            }),
          );
        }
        save();
      }
      function addFiles(fl) {
        const ok = [];
        [...fl].forEach((f) => {
          const good = /\.(pdf|png|jpe?g)$/i.test(f.name);
          if (!good) toast(`${f.name}: only PDF, JPG or PNG`, "err");
          else if (f.size > 20 * 1048576) toast(`${f.name} is over 20 MB`, "err");
          else ok.push(f);
        });
        if (ok.length) {
          readDraft();
          ui.files = ui.files.concat(ok);
          render();
          toast(`${ok.length} file(s) attached`);
        }
      }

          ["Licence expires in 42 days", "Vistara Gaskets", "sup:vistara"],

          $("#decReason").focus();
          return;

        commitDecision(d, r);

      function commitDecision(d, r) {
        const go2 = () => {
          state.decision = d;
          state.decisionReason = r;
          if (d === "Approved" || d === "Approved with conditions") {
            state.eligible = true;
            state.decision = d === "Approved" ? "Approved" : "Approved with Conditions";
            state.hold = false;
            log(
              "21 Aug 2025",
              "Decision recorded: " + state.decision,
              r + " (decided by " + state.owner + ")",
              "Decision",
            );
          } else if (d === "Hold for review") {
            state.hold = true;
            state.holdReason = "Decision: hold · " + r;
            log("21 Aug 2025", "Placed on hold", r, "Decision");
          } else if (d === "Not Approved") {
            state.eligible = false;
            log("21 Aug 2025", "Decision recorded: Not Approved", r, "Decision");
          } else {
            state.decision = "Insufficient information";
            log("21 Aug 2025", "Decision: insufficient information", r, "Decision");
          }
          closeModal();
          render();
          toast("Decision recorded: " + d);
        };
        if (d === "Not Approved") {
          ui.confirmFn = go2;
          return confirmBox(
            "Not approve this supplier?",
            "This is a material decision. The reason will be saved to the audit trail, and you can reopen the review with new evidence.",
            "Confirm not approved",
            go2,
          );
        }
        go2();

            () => {
              state.alertResolved = true;
              state.disposition = "Dismissed with reason";
              state.resolveNote = n;
              log(A().resDate, "Alert dismissed", n, "Resolved");
              render();
              toast("Alert dismissed with reason");
            },
          );
        },
        resolve() {
          openModal(
            mhead(
              "RESOLVE EMERGING RISK EVENT",
              "Record supplier clarification",
              "Document the evidence and any conditions.",
            ) +
              `<div class="modalbody"><div class="banner"><span>ⓘ</span><div><b>Simulation</b><p>The supplier clarification below is sample text, not verified real-world data. Edit it as needed.</p></div></div><div class="field" style="margin-top:13px"><label for="resNote">Resolution note (required)</label><textarea id="resNote" rows="4">${esc(A().resolve)}</textarea></div></div>` +
              mfoot(
                "Saved to the audit trail.",
                btn("Cancel", "closeModal") + btn("Resolve with follow-up", "saveResolve", "", "primary"),
              ),
            540,
          );
        },
        saveResolve() {
          const n = $("#resNote").value.trim();
          if (!n) return toast("Add a resolution note", "err");
          state.alertResolved = true;
          state.disposition = A().disp;
          state.resolveNote = n;
          log(A().resDate, "Alert resolved", n + " Assessment history updated.", "Resolved");
          closeModal();
          render();
          toast("Alert resolved · history updated");
        },
        assign() {
          openModal(
            mhead("ASSIGN OWNER", "Assign alert owner", "The owner is responsible for the next action.") +
              `<div class="modalbody"><div class="field"><label for="ownerSel">Owner</label><select id="ownerSel">${opts(PEOPLE, state.owner)}</select></div></div>` +
              mfoot("", btn("Cancel", "closeModal") + btn("Assign", "saveOwner", "", "primary")),
            420,
          );
        },
        saveOwner() {
          state.owner = $("#ownerSel").value;
          log(A().reqDate, "Owner assigned", state.owner, "Assignment");
          closeModal();
          render();
          toast("Assigned to " + state.owner);
        },
        editLead() {
          const p = state.profile;
          openModal(
            mhead(
              "DISCOVERY RECORD",
              "Edit supplier information",
              "Updates the profile and due diligence view.",
            ) +
              `<div class="modalbody"><div class="formgrid">${[
                ["name", "Company name"],
                ["country", "Country"],
                ["category", "Category"],
                ["website", "Website"],
              ]
                .map(
                  (f) =>
                    `<div class="field"><label for="e_${f[0]}">${f[1]}</label><input id="e_${f[0]}" data-e="${f[0]}" value="${esc(p[f[0]])}"></div>`,
                )
                .join(
                  "",
                )}<div class="field wide"><label for="e_products">Products or capability</label><input id="e_products" data-e="products" value="${esc(p.products)}"></div></div></div>` +
              mfoot(
                "Uploaded evidence stays attached.",
                btn("Cancel", "closeModal") + btn("Save", "saveEdit", "", "primary"),
              ),
            540,
          );
        },
        saveEdit() {
          const v = {};
          $$("[data-e]").forEach((e) => (v[e.dataset.e] = e.value.trim()));
          if (!v.name) return toast("Name is required", "err");
          Object.assign(state.profile, v);
          closeModal();
          render();
          toast("Supplier details updated");
        },
        compare() {
          if (ui.cmp.length < 2) return toast("Select at least two suppliers", "err");
          compareModal();
        },
        toggleTask(a) {
          const i = state.tasksDone.indexOf(a);
          i < 0 ? state.tasksDone.push(a) : state.tasksDone.splice(i, 1);
          $("#qbody").innerHTML = queueBody();
          save();
        },
        export() {
          const V = views().filter((v) => v.monitored);
          const csv = ["Supplier,Country,Stage,Risk,Confidence,Coverage %,Open alerts"]
            .concat(
              V.map((v) =>
                [v.name, v.country, v.stage, v.risk, v.conf, v.cov, v.alerts]
                  .map((x) => '"' + String(x).replace(/"/g, '""') + '"')
                  .join(","),
              ),
            )
            .join("\n");
          const u = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
          const a = document.createElement("a");
          a.href = u;
          a.download = "monitored-suppliers.csv";
          a.click();
          setTimeout(() => URL.revokeObjectURL(u), 500);
          toast("CSV exported (simulated data)");
        },
        resetSettings() {
          state.settings = defaults().settings;
          render();
          toast("Settings reset to defaults");
        },
        resetDemo() {
          confirmBox(
            "Reset the demo?",
            "Clears the supplier you captured and all progress, decisions and settings.",
            "Reset everything",
            () => {
              state = defaults();
              ui.files = [];
              ui.cmp = [];
              ui.errors = {};
              save();
              render();
              toast("Demo reset");
            },
          );
        },
        bell() {
          const p = $("#notifPop");
          p.classList.toggle("hidden");
          if (!p.classList.contains("hidden")) {
            p.innerHTML =
              `<div class="cardhead" style="padding:12px 14px 0"><h2>Notifications</h2>${btn("Mark all read", "markRead", "", "link small")}</div>` +
              notifs()
                .map((n) =>
                  row(
                    "!",
                    n[0],
                    n[1],
                    "",
                    `data-act="notifGo" data-arg="${n[2]}" role="button" tabindex="0"`,
                  ),
                )
                .join("");
          }
        },
        markRead() {
          state.notifRead = true;
          $("#notifPop").classList.add("hidden");
          render();
        },
        notifGo(a) {
          $("#notifPop").classList.add("hidden");
          state.notifRead = true;
          a.startsWith("sup:") ? ACT.sup(a.slice(4)) : go(a);
        },
      };
      const CHG = {
        projDrive(a, t) {
          state.settings.projectDriven = t.checked;
          render();
        },

        cmp(a, t) {
          const i = ui.cmp.indexOf(a);
          if (t.checked && i < 0) {
            if (ui.cmp.length >= 4) {
              t.checked = false;
              return toast("Compare up to four suppliers", "err");
            }
            ui.cmp.push(a);
          } else if (!t.checked && i >= 0) ui.cmp.splice(i, 1);
          const b = $("[data-act=compare]");
          if (b) {
            b.textContent = `Compare selected (${ui.cmp.length})`;
            b.disabled = ui.cmp.length < 2;
          }
        },
        dirStage(a, t) {
          state.dirStage = t.value;
          $("#dirbody").innerHTML = dirBody("all");
          save();
        },
        reqsel(a, t) {
          state.selectedRequests[+a] = t.checked;
          render();
          return;
          const b = $("[data-act=sendRequests]");
          if (b) {
            b.textContent = `Send selected requests (${nSel()})`;
            b.disabled = !nSel();
          }
          save();
        },
        dueMonth(a, t) {
          state.dueMonth = t.value;
          render();
        },
        qpri(a, t) {
          state.qf.pri = t.value;
          $("#qbody").innerHTML = queueBody();
          save();
        },
        qsup(a, t) {
          state.qf.sup = t.value;
          $("#qbody").innerHTML = queueBody();
          save();
        },
        qstatus(a, t) {
          state.qf.status = t.value;
          $("#qbody").innerHTML = queueBody();
          save();
        },
        ctl(a, t) {
          state.settings.controls[a] = t.checked;
          render();
        },
        win(a, t) {
          state.settings.window = t.value;
          save();
          toast("Correlation window: " + t.value);
        },
        hr(a, t) {
          state.settings.humanReview = t.value;
          save();
          toast("Human review policy updated");
        },
        freq(a, t) {
          state.settings.freq[a] = t.value;
          save();
          toast(a + " criticality cadence updated");
        },
        draft() {},
      };
      const INP = {
        dirFilter(a, t) {
          state.dirFilter = t.value;
          $("#dirbody").innerHTML = dirBody("all");
        },
        qq(a, t) {
          state.qf.q = t.value;
          $("#qbody").innerHTML = queueBody();
        },
        w(a, t) {
          const n = Math.max(0, Math.min(100, +t.value || 0));
          state.settings.weights[a] = n;
          const w = state.settings.weights,
            tot = w.fin + w.ops + w.comp + w.legal + w.corp;
          const e = $("#wtotal");
          e.textContent = `Total: ${tot}% ${tot === 100 ? "· valid" : "· must equal 100%"}`;
          e.style.color = tot === 100 ? "#21825c" : "#b94e43";
          save();
        },
        mincov(a, t) {
          state.settings.minCoverage = Math.max(0, Math.min(100, +t.value || 0));
          save();
        },
      };
      document.addEventListener("click", (e) => {
        const t = e.target.closest("[data-act]");
        if (!e.target.closest("#notifPop,#bell")) $("#notifPop").classList.add("hidden");
        if (!e.target.closest(".searchwrap")) $("#sresults").classList.add("hidden");
        if (e.target === $("#modal") && !$("#wizFinish")) {
          closeModal();
          return;
        }
        if (!t || t.disabled) return;
        const f = ACT[t.dataset.act];
        if (f) f(t.dataset.arg, t);
      });
      document.addEventListener("change", (e) => {
        const t = e.target;
        if (t.id === "fileUpload") {
          addFiles(t.files);
          return;
        }
        const c = t.closest("[data-change]");
        if (c && CHG[c.dataset.change]) CHG[c.dataset.change](c.dataset.arg, c);
        if (t.matches("[data-draft]")) state.draft[t.dataset.draft] = t.value;
      });
      document.addEventListener("input", (e) => {
        const t = e.target;
        if (t.matches("[data-draft]")) {
          state.draft[t.dataset.draft] = t.value;
          if (ui.errors[t.dataset.draft]) {
            delete ui.errors[t.dataset.draft];
          }
          return;
        }
        const c = t.closest("[data-input]");
        if (c && INP[c.dataset.input]) INP[c.dataset.input](c.dataset.arg, c);
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if ($("#modal").classList.contains("open")) closeModal();
          $("#notifPop").classList.add("hidden");
          $("#sresults").classList.add("hidden");
        }
        if ((e.key === "Enter" || e.key === " ") && e.target.matches("[role=button]")) {
          e.preventDefault();
          e.target.click();
        }
        if (e.key === "Enter" && e.target.id === "globalSearch") {
          const f = ui.sres[0];
          if (f) {
            e.target.value = "";
            $("#sresults").classList.add("hidden");
            ACT.sup(f.id);
          } else toast("No supplier matches that search");
        }
      });
      $("#globalSearch").addEventListener("input", (e) => {
        const q = e.target.value.trim().toLowerCase(),
          box = $("#sresults");
        ui.sres = q
          ? views().filter((v) => (v.name + " " + v.country + " " + v.category).toLowerCase().includes(q))
          : [];
        box.classList.toggle("hidden", !q);
        box.innerHTML = ui.sres.length
          ? ui.sres.map((v) => rowSup(v, badge(v.stage, stageColor(v.stage)))).join("")
          : '<div class="signal" style="margin:8px"><strong>No suppliers found</strong><p>Try a name, country or category, or add a new supplier.</p></div>';
      });
      $("#modal").addEventListener("click", (e) => {});
      render();
    </script>
  </body>
</html>
